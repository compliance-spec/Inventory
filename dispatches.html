<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch call queue</title>
<style>
  :root{
    --ink:#1c2622; --ink-soft:#5b665f; --line:#e3e0d6;
    --bg:#faf9f5; --card:#ffffff;
    --brand:#1c3d36; --brand-ink:#eef4f1;
    --go:#1f7a4d; --go-bg:#e7f4ec;
    --wait:#b4790f; --wait-bg:#fbf0dc;
    --late:#b23b34; --late-bg:#faeae8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:var(--brand); color:var(--brand-ink);
    padding:18px 16px 14px; position:sticky; top:0; z-index:5;
  }
  header h1{margin:0; font-size:19px; font-weight:600; letter-spacing:.2px;}
  header .row{display:flex; justify-content:space-between; align-items:baseline; margin-top:2px;}
  header .count{font-size:13px; opacity:.85;}
  header .switch{font-size:12px; opacity:.8; background:none; border:none; color:inherit; text-decoration:underline; padding:0; cursor:pointer;}

  .filter-bar{
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px 0; -webkit-overflow-scrolling:touch;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:7px 13px; border-radius:20px; border:1px solid var(--line);
    background:var(--card); font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{background:var(--brand); color:var(--brand-ink); border-color:var(--brand);}

  main{padding:12px; max-width:520px; margin:0 auto; padding-bottom:60px;}

  .empty{text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:15px;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:10px;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .dist{font-size:16px; font-weight:600; line-height:1.3;}
  .meta{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .badge{
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px;
    white-space:nowrap; flex-shrink:0;
  }
  .badge.go{color:var(--go); background:var(--go-bg);}
  .badge.wait{color:var(--wait); background:var(--wait-bg);}
  .badge.late{color:var(--late); background:var(--late-bg);}

  .value{font-size:13px; color:var(--ink-soft); margin-top:6px;}

  .actions{display:flex; gap:8px; margin-top:12px;}
  .btn{
    flex:1; border:none; border-radius:9px; padding:11px 10px;
    font-size:13.5px; font-weight:600; cursor:pointer; text-align:center;
    text-decoration:none; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn.call{background:var(--brand-ink); color:var(--brand); border:1px solid var(--brand);}
  .btn.dispatched{background:var(--go); color:#fff;}
  .btn.pending{background:#fff; color:var(--ink-soft); border:1px solid var(--line);}

  .confirm{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:none;}
  .confirm.open{display:block;}
  .confirm label{font-size:12.5px; color:var(--ink-soft); display:block; margin-bottom:5px;}
  .confirm input[type=date]{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; color:var(--ink); margin-bottom:8px;
  }
  .confirm .row{display:flex; gap:8px;}
  .confirm .row .btn{padding:9px 10px;}
  .btn.ghost{background:none; color:var(--ink-soft); border:1px solid var(--line);}

  /* name picker overlay */
  .overlay{
    position:fixed; inset:0; background:var(--bg); z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
  }
  .overlay h2{font-size:18px; margin-bottom:4px;}
  .overlay p{font-size:13.5px; color:var(--ink-soft); margin-top:0; margin-bottom:20px; text-align:center;}
  .name-grid{display:flex; flex-direction:column; gap:8px; width:100%; max-width:320px;}
  .name-btn{
    padding:13px; border-radius:10px; border:1px solid var(--line); background:var(--card);
    font-size:15px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .name-btn:active{background:var(--brand-ink);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:20;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="picker" class="overlay" style="display:none;">
  <h2>Who's calling?</h2>
  <p>Pick your name — this is remembered on this phone.</p>
  <div id="nameGrid" class="name-grid"></div>
</div>

<header>
  <div class="row">
    <h1>Dispatch call queue</h1>
    <button class="switch" onclick="switchUser()">switch user</button>
  </div>
  <div class="count" id="countLine">Loading…</div>
</header>

<div class="filter-bar" id="filterBar"></div>
<main id="list"></main>
<div id="toast" class="toast"></div>

<script>
// ====== CONFIG — set this after deploying the Apps Script web app ======
const API_URL = 'https://script.google.com/macros/s/AKfycbyYNKV77IUzU1xtxP3qG6FTpPABYNxESSMETp0c9nal9FHWsyLD_rxdXKQKNAj3RnzaqQ/exec';

let currentAsm = localStorage.getItem('dispatchAsmName') || '';
let orders = [];
let activeDistributor = 'All';

function daysPending(orderDate){
  const d = new Date(orderDate);
  const now = new Date();
  d.setHours(0,0,0,0); now.setHours(0,0,0,0);
  return Math.max(0, Math.round((now - d) / 86400000));
}

function badgeClass(days){
  if (days <= 1) return 'go';
  if (days <= 3) return 'wait';
  return 'late';
}

function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
}

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

async function loadOrders(){
  document.getElementById('countLine').textContent = 'Loading…';
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    orders = data.orders || [];
    populatePicker(data.asmList || []);
    render();
  }catch(err){
    document.getElementById('countLine').textContent = 'Could not load — check connection';
  }
}

function populatePicker(asmList){
  if (currentAsm) return;
  const grid = document.getElementById('nameGrid');
  grid.innerHTML = '';
  asmList.forEach(name => {
    const b = document.createElement('button');
    b.className = 'name-btn';
    b.textContent = name;
    b.onclick = () => { currentAsm = name; localStorage.setItem('dispatchAsmName', name); document.getElementById('picker').style.display = 'none'; render(); };
    grid.appendChild(b);
  });
  document.getElementById('picker').style.display = 'flex';
}

function switchUser(){
  currentAsm = '';
  localStorage.removeItem('dispatchAsmName');
  loadOrders();
}

function renderFilterBar(){
  const bar = document.getElementById('filterBar');
  const distributors = [...new Set(orders.map(o => o['Distributor']).filter(Boolean))].sort();
  if (!distributors.includes(activeDistributor)) activeDistributor = 'All';

  const chips = ['All', ...distributors];
  bar.innerHTML = '';
  chips.forEach(name => {
    const count = name === 'All' ? orders.length : orders.filter(o => o['Distributor'] === name).length;
    const chip = document.createElement('button');
    chip.className = 'chip' + (name === activeDistributor ? ' active' : '');
    chip.textContent = name === 'All' ? `All (${count})` : `${name} (${count})`;
    chip.onclick = () => { activeDistributor = name; render(); };
    bar.appendChild(chip);
  });
}

function render(){
  const list = document.getElementById('list');
  renderFilterBar();

  const visible = activeDistributor === 'All' ? orders : orders.filter(o => o['Distributor'] === activeDistributor);

  document.getElementById('countLine').textContent = orders.length
    ? visible.length + ' pending' + (activeDistributor !== 'All' ? ' · ' + activeDistributor : '') + (currentAsm ? ' · ' + currentAsm : '')
    : 'All caught up';

  if (visible.length === 0){
    list.innerHTML = `<div class="empty">${orders.length ? 'No pending orders for this distributor.' : 'No pending dispatches. Nice.'}</div>`;
    return;
  }

  list.innerHTML = '';
  visible.forEach(o => {
    const days = daysPending(o['Order Date']);
    const card = document.createElement('div');
    card.className = 'card';
    const phone = (o['Phone'] || '').toString().replace(/[^0-9+]/g,'');
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="dist">${escapeHtml(o['Distributor'] || 'Unknown distributor')}</div>
          <div class="meta">for ${escapeHtml(o['Retail Outlet'] || 'outlet not recorded')}</div>
          <div class="meta">${escapeHtml(o['SO Name'] || '')} · ordered ${fmtDate(o['Order Date'])}</div>
        </div>
        <div class="badge ${badgeClass(days)}">${days===0 ? 'today' : days+'d pending'}</div>
      </div>
      ${o['Order Value'] ? `<div class="value">Order value: ₹${escapeHtml(String(o['Order Value']))}</div>` : ''}
      <div class="actions">
        ${phone ? `<a class="btn call" href="tel:${phone}">Call</a>` : `<div class="btn call" style="opacity:.4;">No number</div>`}
        <button class="btn dispatched" onclick="openConfirm(this)">Dispatched</button>
        <button class="btn pending" onclick="markPending(${o._row}, this)">Still pending</button>
      </div>
      <div class="confirm">
        <label>Actual dispatch date (ask the distributor — not today by default)</label>
        <input type="date" value="${todayISO()}" max="${todayISO()}">
        <div class="row">
          <button class="btn dispatched" onclick="confirmDispatch(${o._row}, this)">Confirm</button>
          <button class="btn ghost" onclick="closeConfirm(this)">Cancel</button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openConfirm(btn){
  btn.closest('.card').querySelector('.confirm').classList.add('open');
}
function closeConfirm(btn){
  btn.closest('.card').querySelector('.confirm').classList.remove('open');
}

async function confirmDispatch(row, btn){
  const card = btn.closest('.card');
  const date = card.querySelector('input[type=date]').value;
  if (!date){ showToast('Pick a date first'); return; }
  await postAction({ row, action: 'dispatch', actualDate: date, calledBy: currentAsm });
  orders = orders.filter(o => o._row !== row);
  render();
  showToast('Marked dispatched');
}

async function markPending(row, btn){
  await postAction({ row, action: 'pending', calledBy: currentAsm });
  btn.disabled = true;
  btn.textContent = 'Logged';
  showToast('Follow-up logged, will resurface tomorrow');
}

async function postAction(payload){
  try{
    await fetch(API_URL, { method:'POST', body: JSON.stringify(payload) });
  }catch(err){
    showToast('Network error — try again');
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

loadOrders();
</script>
</body>
</html>
