<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OCD — Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{--black:#0A0A08;--white:#F2EFE8;--border:rgba(242,239,232,0.13);--muted:rgba(242,239,232,0.38);--red:#E8372A;--green:#3DBF72;--gold:#D4A857;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;}
.app{display:flex;flex-direction:column;min-height:100vh;padding:12px 16px 20px;gap:10px;}
.header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.page-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.06em;}
.header-btns{display:flex;gap:6px;flex-shrink:0;}
.stock-btn{background:rgba(242,239,232,0.1);color:var(--white);border:1px solid var(--border);padding:7px 12px;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:0.05em;border-radius:4px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
hr.div{border:none;border-top:1px solid var(--border);flex-shrink:0;margin:0;}
.sl{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block;flex-shrink:0;}
.status-bar{font-size:11px;min-height:14px;flex-shrink:0;}
.status-bar.ok{color:var(--green);}
.status-bar.err{color:var(--red);}
.status-bar.warn{color:var(--gold);}
.status-bar.dim{color:var(--muted);}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0;}
.chip{background:rgba(242,239,232,0.04);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.chip.sel{border-color:var(--white);background:rgba(242,239,232,0.12);color:var(--white);}

.cust-input{width:100%;background:rgba(242,239,232,0.07);border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--white);outline:none;-webkit-appearance:none;margin-bottom:8px;}
.cust-input::placeholder{color:var(--muted);}
.cust-input:focus{border-color:rgba(242,239,232,0.4);}

.frag-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex-shrink:0;}
.frag-btn{background:rgba(242,239,232,0.04);border:1px solid var(--border);border-radius:6px;padding:7px 3px;text-align:center;cursor:pointer;}
.frag-dot{width:18px;height:18px;border-radius:50%;margin:0 auto 4px;}
.frag-lbl{font-size:8px;color:var(--muted);line-height:1.2;}
.frag-btn.sel{border-color:var(--white);background:rgba(242,239,232,0.12);}
.frag-btn.sel .frag-lbl{color:var(--white);}

.stepper{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.stepper button{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:rgba(242,239,232,0.06);color:var(--white);font-size:17px;line-height:1;cursor:pointer;}
.stepper input{flex:1;text-align:center;background:rgba(242,239,232,0.04);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--white);font-family:'Bebas Neue',sans-serif;font-size:18px;outline:none;-moz-appearance:textfield;}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

.action-tabs{display:flex;gap:6px;overflow-x:auto;flex-shrink:0;padding-bottom:2px;}
.action-tab{background:rgba(242,239,232,0.04);border:1px solid var(--border);border-radius:20px;padding:8px 13px;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:0.04em;color:var(--muted);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.action-tab.active{border-color:var(--white);background:rgba(242,239,232,0.12);color:var(--white);}

.panel{display:none;flex-direction:column;gap:2px;border:1px solid var(--border);border-radius:10px;padding:12px;flex-shrink:0;}
.panel.active{display:flex;}

#submitBtn{width:100%;background:var(--white);color:var(--black);border:none;padding:13px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.08em;border-radius:4px;cursor:pointer;flex-shrink:0;}
#submitBtn:disabled{opacity:0.3;cursor:not-allowed;}

#successFlash{position:fixed;inset:0;background:rgba(10,10,8,0.92);display:none;align-items:center;justify-content:center;z-index:99;}
#successFlash.show{display:flex;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.success-inner{text-align:center;}
.success-inner .big{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:0.06em;color:var(--green);line-height:1.1;}
.success-inner .sm{font-size:13px;color:var(--muted);margin-top:6px;}

#userOverlay,#stockOverlay{position:fixed;inset:0;z-index:60;background:var(--black);display:none;flex-direction:column;padding:12px 16px 20px;gap:10px;overflow-y:auto;}
#userOverlay.open,#stockOverlay.open{display:flex;}
.ov-header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ov-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.06em;}
.ov-close{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 12px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.06em;border-radius:4px;cursor:pointer;}

.user-row{border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.user-row.sel{border-color:var(--green);background:rgba(61,191,114,0.08);}
.user-name{font-size:14px;}
.user-role{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}

table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;}
.refresh-lbl{font-size:10px;color:var(--muted);text-align:right;text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>

<div id="successFlash">
  <div class="success-inner">
    <div class="big" id="successBig">SAVED ✓</div>
    <div class="sm">Clearing in a moment…</div>
  </div>
</div>

<div id="userOverlay">
  <div class="ov-header">
    <div class="ov-title">WHO'S LOGGED IN?</div>
    <button class="ov-close" onclick="closeUserOverlay()">✕ Close</button>
  </div>
  <hr class="div">
  <div class="status-bar dim">Tap your name, then enter your PIN.</div>
  <div id="userList"><div class="status-bar dim">Loading…</div></div>
</div>

<div id="stockOverlay">
  <div class="ov-header">
    <div class="ov-title">STOCK SUMMARY</div>
    <button class="ov-close" onclick="closeStockOverlay()">✕ Close</button>
  </div>
  <hr class="div">
  <div id="stockTable"><div class="status-bar dim">Loading…</div></div>
  <div class="refresh-lbl" onclick="loadStockSummary()">↻ Refresh</div>
</div>

<div class="app">
  <div class="header">
    <div class="page-label">Inventory</div>
    <div class="header-btns">
      <button class="stock-btn" id="syncBtn" onclick="syncPendingQueue(false)" style="display:none;"></button>
      <button class="stock-btn" onclick="openStockOverlay()">📦 Stock</button>
      <button class="stock-btn" onclick="openUserOverlay()" id="userBtn">👤 Login</button>
    </div>
  </div>
  <hr class="div">
  <div class="action-tabs" id="actionTabs"></div>
  <div id="panels"></div>
  <button id="submitBtn" disabled onclick="submitCurrentAction()">Submit</button>
  <div class="status-bar dim" id="actionStatus"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbya3DCbhegmcoOLEMIPHIRTrEDAVSSOjATtT0IIqCFigYUAM7NZ7paUxWLnlMdSLcN7xw/exec';

const SCENTS = ['Skinny Dip','Midnight Snack','About Last Night','Freshly Picked','Still Not Over It'];
const SCENT_COLORS = {
  'Skinny Dip':'#5B7FB5','Midnight Snack':'#5A2510','About Last Night':'#8A9E72',
  'Freshly Picked':'#C8B89A','Still Not Over It':'#6B1E24'
};
let WAREHOUSE_SUGGESTIONS = []; // loaded from the warehouses sheet

const USER_KEY = 'ocd_inv_user';
const PENDING_KEY = 'ocd_inv_pending';

let currentUser = null;
let currentAction = null;
let carts = {}; // per action-key cart of lines, for cart-based actions

// ═══════════════════════════════════════════════════════
//  ACTIONS — single source of truth for every tab.
//  locMode: 'warehouseOnly' | 'warehouseAndEvent' | 'twoWarehouses' | 'generic'
//    'generic' = one self-contained Warehouse-or-Event picker inside the panel.
//  skus: if present, this tab is a multi-line CART (add several SKUs, one submit).
//  simple / special: single-form tabs (not carts).
// ═══════════════════════════════════════════════════════
const ACTIONS = {
  sale:      { label:'Sale',          apiAction:'bulkSale',               locMode:'generic',          skus:['DS','50ML','VIAL'], valueKey:'qty', hasAmount:true },
  receive:   { label:'Receive',       apiAction:'bulkReceiveProcurement', locMode:'warehouseOnly',     skus:['DS','50ML'], valueKey:'qty' },
  opening:   { label:'Opening stock', apiAction:'bulkSetOpeningStock',    locMode:'warehouseOnly',     skus:['DS','50ML'], valueKey:'targetQty', valueLabel:'Actual qty on hand' },
  transfer:  { label:'Transfer',      apiAction:'bulkInternalTransfer',   locMode:'twoWarehouses',     skus:['DS','50ML'], valueKey:'qty' },
  outward:   { label:'Outward',       apiAction:'bulkOutwardToFest',      locMode:'warehouseAndEvent', skus:['DS','50ML'], valueKey:'qty' },
  inward:    { label:'Inward',        apiAction:'bulkInwardFromFest',     locMode:'warehouseAndEvent', skus:['DS','50ML'], valueKey:'qty' },
  breakSet:  { label:'Break set',     apiAction:'breakSet',               locMode:'generic',           special:'setQC' },
  giveFree:  { label:'Give free',     apiAction:'giveVialFree',           locMode:'generic',           simple:true, needsScent:true, needsQty:true },
  writeOff:  { label:'Write off',     apiAction:'writeOffVial',           locMode:'generic',           simple:true, needsScent:true, needsQty:true, needsReason:true },
  reassemble:{ label:'Reassemble',    apiAction:'reassembleKit',          locMode:'generic',           simple:true, needsQty:true },
  bookPool:  { label:'Book pool',     apiAction:'bookPoolAsKitSale',      locMode:'generic',           simple:true, needsDsPrice:true },
};

// ═══════════════════════════════════════════════════════
//  TAB / PANEL SCAFFOLDING
// ═══════════════════════════════════════════════════════
function buildActionTabs(){
  const wrap = document.getElementById('actionTabs');
  const keys = Object.keys(ACTIONS);
  wrap.innerHTML = keys.map((key,i)=>
    '<div class="action-tab'+(i===0?' active':'')+'" id="tab-'+key+'" onclick="switchAction(\''+key+'\')">'+ACTIONS[key].label+'</div>'
  ).join('');
  keys.forEach(key=>{
    if(ACTIONS[key].skus) buildCartPanel(key);
    else buildSimplePanel(key);
  });
  switchAction(keys[0]);
}

function switchAction(key){
  currentAction = key;
  document.querySelectorAll('.action-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+key).classList.add('active');
  document.getElementById('panel-'+key).classList.add('active');
  document.getElementById('actionStatus').textContent = '';
  checkReady();
}

// ═══════════════════════════════════════════════════════
//  LOCATION FIELDS — warehouseFieldHtml (free text + suggestions) is used
//  by warehouseOnly / warehouseAndEvent / twoWarehouses. genericLocationHtml
//  (Warehouse-or-Event choice) is used by everything else that needs ONE
//  location. Each panel gets exactly one of these — never both.
// ═══════════════════════════════════════════════════════
function warehouseFieldHtml(field, label){
  return '<span class="sl">'+label+'</span>'
    + '<input class="cust-input" data-field="'+field+'" placeholder="Type warehouse name" oninput="checkReady()">'
    + '<div class="chip-row warehouse-suggest-row" data-for-field="'+field+'" style="margin-top:-4px;margin-bottom:8px;"></div>';
}

function genericLocationHtml(){
  return '<span class="sl">Location</span>'
    + '<div class="chip-row" data-locmode-row>'
      + '<div class="chip" data-val="warehouse" onclick="pickGenericLocType(this)">Warehouse</div>'
      + '<div class="chip" data-val="event" onclick="pickGenericLocType(this)">Fest / event</div>'
    + '</div>'
    + '<input class="cust-input" data-field="genWarehouse" placeholder="Type warehouse name" style="display:none;" oninput="checkReady()">'
    + '<div class="chip-row warehouse-suggest-row" data-for-field="genWarehouse" style="display:none;margin-top:-4px;margin-bottom:8px;"></div>'
    + '<input class="cust-input" data-field="genEvent" placeholder="Event ID e.g. FEST-2026-08-22-Andheri" style="display:none;" oninput="checkReady()">';
}

function pickGenericLocType(el){
  const panel = el.closest('.panel');
  panel.querySelectorAll('[data-locmode-row] .chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  const isWh = el.dataset.val === 'warehouse';
  panel.querySelector('[data-field="genWarehouse"]').style.display = isWh ? 'block' : 'none';
  panel.querySelector('.warehouse-suggest-row[data-for-field="genWarehouse"]').style.display = isWh ? 'flex' : 'none';
  panel.querySelector('[data-field="genEvent"]').style.display = isWh ? 'none' : 'block';
  checkReady();
}

function readGenericLocation(panel){
  const sel = panel.querySelector('[data-locmode-row] .chip.sel');
  if(!sel) return null;
  const locationType = sel.dataset.val;
  const location = locationType === 'warehouse'
    ? panel.querySelector('[data-field="genWarehouse"]').value.trim()
    : panel.querySelector('[data-field="genEvent"]').value.trim();
  if(!location) return null;
  return { locationType, location };
}

function renderWarehouseSuggestChips(){
  document.querySelectorAll('.warehouse-suggest-row').forEach(row=>{
    const field = row.dataset.forField;
    row.innerHTML = WAREHOUSE_SUGGESTIONS.map(w=>'<div class="chip" onclick="fillWarehouseField(this,\''+field+'\',\''+w.replace(/'/g,"\\'")+'\')">'+w+'</div>').join('')
      + '<div class="chip" style="color:var(--gold);" onclick="promptAddWarehouse(this,\''+field+'\')">+ New</div>';
  });
}
async function loadWarehouseSuggestions(){
  try{
    const res = await fetch(SCRIPT_URL+'?action=getWarehouses');
    const json = await res.json();
    if(json.ok) WAREHOUSE_SUGGESTIONS = json.data;
  }catch(e){}
  renderWarehouseSuggestChips();
}
function fillWarehouseField(el, field, value){
  const panel = el.closest('.panel');
  panel.querySelector('input[data-field="'+field+'"]').value = value;
  checkReady();
}
async function promptAddWarehouse(el, field){
  const name = prompt('New warehouse name:');
  if(!name || !name.trim()) return;
  if(!currentUser){ alert('Pick a user (Login) first.'); return; }
  try{
    await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'addWarehouse', user_id:currentUser.user_id, params:{ name: name.trim() } }) });
  }catch(e){}
  WAREHOUSE_SUGGESTIONS.push(name.trim());
  renderWarehouseSuggestChips();
  fillWarehouseField(el, field, name.trim());
}

// ═══════════════════════════════════════════════════════
//  CART PANELS — Sale, Receive, Opening stock, Transfer, Outward, Inward.
//  Pick an item + qty, add to cart, repeat, submit the whole cart once.
// ═══════════════════════════════════════════════════════
const SKU_LABELS = { DS:'Discovery Set', '50ML':'50ml', VIAL:'Loose vial' };

function buildCartPanel(key){
  const a = ACTIONS[key];
  carts[key] = [];
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-' + key;

  let locHtml = '';
  if(a.locMode === 'warehouseOnly') locHtml = warehouseFieldHtml('warehouse','Warehouse');
  else if(a.locMode === 'warehouseAndEvent') locHtml = warehouseFieldHtml('warehouse','Warehouse') + '<span class="sl">Event ID</span><input class="cust-input" data-field="eventId" placeholder="FEST-2026-08-22-Andheri" oninput="checkReady()">';
  else if(a.locMode === 'twoWarehouses') locHtml = warehouseFieldHtml('fromWarehouse','From warehouse') + warehouseFieldHtml('toWarehouse','To warehouse');
  else if(a.locMode === 'generic') locHtml = genericLocationHtml();

  const skuChips = a.skus.map(s=>'<div class="chip" data-val="'+s+'" onclick="pickCartSku(\''+key+'\',this)">'+SKU_LABELS[s]+'</div>').join('');
  const scentChips = SCENTS.map(s=>'<div class="frag-btn" data-val="'+s+'" onclick="pickCartScent(\''+key+'\',this)"><div class="frag-dot" style="background:'+SCENT_COLORS[s]+'"></div><div class="frag-lbl">'+s.split(' ')[0]+'<br>'+s.split(' ').slice(1).join(' ')+'</div></div>').join('');

  panel.innerHTML = locHtml
    + '<hr class="div" style="margin:4px 0 8px;">'
    + '<span class="sl">Item type</span><div class="chip-row" data-cart-sku-row style="margin-bottom:8px;">'+skuChips+'</div>'
    + '<div data-cart-scent-wrap style="display:none;"><span class="sl">Scent</span><div class="frag-grid" data-cart-scent-grid>'+scentChips+'</div></div>'
    + '<span class="sl">'+(a.valueLabel||'Quantity')+'</span><input class="cust-input" type="number" min="0" data-cart-value placeholder="0">'
    + (a.hasAmount ? '<span class="sl">Amount for this line (Rs)</span><input class="cust-input" type="number" min="0" data-cart-amount placeholder="0">' : '')
    + '<button class="stock-btn" style="width:100%;padding:10px;margin-bottom:8px;" onclick="addCartLine(\''+key+'\')">+ Add to cart</button>'
    + '<hr class="div" style="margin-bottom:8px;">'
    + '<span class="sl">Items in this entry</span>'
    + '<div id="cartBox-'+key+'" style="border:1px solid var(--border);border-radius:8px;padding:2px 10px;"><div class="status-bar dim" style="padding:8px 0;">Nothing added yet</div></div>';

  document.getElementById('panels').appendChild(panel);
}

function pickCartSku(key, el){
  const panel = document.getElementById('panel-'+key);
  panel.querySelectorAll('[data-cart-sku-row] .chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  const needsScent = el.dataset.val === '50ML' || el.dataset.val === 'VIAL';
  panel.querySelector('[data-cart-scent-wrap]').style.display = needsScent ? 'block' : 'none';
  panel.querySelectorAll('[data-cart-scent-grid] .frag-btn').forEach(c=>c.classList.remove('sel'));
}
function pickCartScent(key, el){
  const panel = document.getElementById('panel-'+key);
  panel.querySelectorAll('[data-cart-scent-grid] .frag-btn').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}

function addCartLine(key){
  const panel = document.getElementById('panel-'+key);
  const a = ACTIONS[key];
  const skuEl = panel.querySelector('[data-cart-sku-row] .chip.sel');
  if(!skuEl){ alert('Pick an item type first.'); return; }
  const sku = skuEl.dataset.val;
  let variant = '';
  if(sku === '50ML' || sku === 'VIAL'){
    const scentEl = panel.querySelector('[data-cart-scent-grid] .frag-btn.sel');
    if(!scentEl){ alert('Pick a scent first.'); return; }
    variant = scentEl.dataset.val;
  }
  const valueInput = panel.querySelector('[data-cart-value]');
  if(valueInput.value === '' || Number(valueInput.value) < 0){ alert('Enter a quantity.'); return; }
  const value = Number(valueInput.value);
  const amountInput = panel.querySelector('[data-cart-amount]');
  const line = { sku: sku, variant: variant };
  line[a.valueKey] = value;
  if(a.hasAmount) line.amount = amountInput ? (Number(amountInput.value) || 0) : 0;
  carts[key].push(line);

  valueInput.value = '';
  if(amountInput) amountInput.value = '';
  renderCart(key);
  checkReady();
}
function removeCartLine(key, idx){
  carts[key].splice(idx,1);
  renderCart(key);
  checkReady();
}
function renderCart(key){
  const box = document.getElementById('cartBox-'+key);
  const lines = carts[key];
  if(!lines.length){ box.innerHTML = '<div class="status-bar dim" style="padding:8px 0;">Nothing added yet</div>'; return; }
  const a = ACTIONS[key];
  let html = '';
  lines.forEach((line, idx)=>{
    const name = SKU_LABELS[line.sku] + (line.variant ? ' — '+line.variant : '');
    const val = line[a.valueKey];
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);gap:8px;">'
      + '<div style="flex:1;font-size:12px;">'+name+' <span style="color:var(--muted);">×'+val+'</span></div>'
      + (a.hasAmount ? '<div style="font-size:11px;color:var(--muted);">₹'+(line.amount||0)+'</div>' : '')
      + '<button onclick="removeCartLine(\''+key+'\','+idx+')" style="width:auto;background:transparent;border:none;color:var(--red);font-size:16px;cursor:pointer;">✕</button>'
      + '</div>';
  });
  box.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  SIMPLE / SPECIAL PANELS — Break Set (bulk QC), Give Free, Write Off,
//  Reassemble, Book Pool. One-shot forms, not carts.
// ═══════════════════════════════════════════════════════
function buildSimplePanel(key){
  const a = ACTIONS[key];
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-' + key;

  let html = a.locMode === 'generic' ? genericLocationHtml() : '';
  html += '<hr class="div" style="margin:4px 0 8px;">';

  if(a.special === 'setQC'){
    html += '<span class="sl">Sets broken today (from your tally)</span><div class="stepper" data-field-stepper="setsBroken">'
      + '<button onclick="stepGeneric(this,-1)">−</button><input type="number" min="0" value="1" data-field="setsBroken" oninput="checkReady()"><button onclick="stepGeneric(this,1)">+</button></div>';
    html += '<span class="sl">Per scent — accept / reject count</span>';
    html += SCENTS.map(s=>
      '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border);">'
      + '<div style="display:flex;align-items:center;gap:6px;width:76px;flex-shrink:0;"><div class="frag-dot" style="width:14px;height:14px;margin:0;background:'+SCENT_COLORS[s]+'"></div><span style="font-size:10px;color:var(--muted);">'+s.split(' ')[0]+'</span></div>'
      + '<div style="flex:1;"><span class="sl" style="margin:0;">Accept</span><input class="cust-input" type="number" min="0" value="0" data-scent="'+s+'" data-kind="accept" oninput="checkReady()"></div>'
      + '<div style="flex:1;"><span class="sl" style="margin:0;">Reject</span><input class="cust-input" type="number" min="0" value="0" data-scent="'+s+'" data-kind="reject" oninput="checkReady()"></div>'
      + '</div>'
    ).join('');
  } else if(a.simple){
    if(a.needsScent){
      html += '<span class="sl">Scent</span><div class="frag-grid" data-field="scent">'
        + SCENTS.map(s=>'<div class="frag-btn" data-val="'+s+'" onclick="pickSimpleChip(this)"><div class="frag-dot" style="background:'+SCENT_COLORS[s]+'"></div><div class="frag-lbl">'+s.split(' ')[0]+'<br>'+s.split(' ').slice(1).join(' ')+'</div></div>').join('')
        + '</div>';
    }
    if(a.needsQty){
      html += '<span class="sl">Quantity</span><div class="stepper"><button onclick="stepGeneric(this,-1)">−</button><input type="number" min="0" value="1" data-field="qty" oninput="checkReady()"><button onclick="stepGeneric(this,1)">+</button></div>';
    }
    if(a.needsReason){
      html += '<span class="sl">Reason</span><div class="chip-row" data-field="reasonCode">'
        + ['leak','damaged','low-fill','other'].map(r=>'<div class="chip" data-val="'+r+'" onclick="pickSimpleChip(this)">'+r+'</div>').join('') + '</div>';
    }
    if(a.needsDsPrice){
      html += '<span class="sl">Discovery Set price (Rs)</span><input class="cust-input" type="number" min="0" data-field="dsPrice" placeholder="500" oninput="checkReady()">';
    }
  }

  panel.innerHTML = html;
  document.getElementById('panels').appendChild(panel);
}

function pickSimpleChip(el){
  const row = el.parentElement;
  row.querySelectorAll('.chip,.frag-btn').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  checkReady();
}
function stepGeneric(btn, delta){
  const input = btn.parentElement.querySelector('input');
  input.value = Math.max(0, (parseInt(input.value)||0) + delta);
  checkReady();
}

// ═══════════════════════════════════════════════════════
//  READY CHECK / SUBMIT — one dispatcher for every action type
// ═══════════════════════════════════════════════════════
function checkReady(){
  const btn = document.getElementById('submitBtn');
  if(!currentUser || !currentAction){ btn.disabled = true; return; }
  const a = ACTIONS[currentAction];
  const panel = document.getElementById('panel-'+currentAction);
  let ready = true;

  if(a.locMode === 'warehouseOnly'){
    if(!panel.querySelector('[data-field="warehouse"]').value.trim()) ready = false;
  } else if(a.locMode === 'warehouseAndEvent'){
    if(!panel.querySelector('[data-field="warehouse"]').value.trim()) ready = false;
    if(!panel.querySelector('[data-field="eventId"]').value.trim()) ready = false;
  } else if(a.locMode === 'twoWarehouses'){
    const from = panel.querySelector('[data-field="fromWarehouse"]').value.trim();
    const to = panel.querySelector('[data-field="toWarehouse"]').value.trim();
    if(!from || !to || from === to) ready = false;
  } else if(a.locMode === 'generic'){
    if(!readGenericLocation(panel)) ready = false;
  }

  if(a.skus){
    if(!carts[currentAction] || carts[currentAction].length === 0) ready = false;
  } else if(a.special === 'setQC'){
    const setsBroken = parseInt(panel.querySelector('[data-field="setsBroken"]').value);
    if(!(setsBroken > 0)) ready = false;
  } else if(a.simple){
    if(a.needsScent && !panel.querySelector('[data-field="scent"] .frag-btn.sel')) ready = false;
    if(a.needsQty && !(parseInt(panel.querySelector('[data-field="qty"]').value) > 0)) ready = false;
    if(a.needsReason && !panel.querySelector('[data-field="reasonCode"] .chip.sel')) ready = false;
    if(a.needsDsPrice){
      const v = panel.querySelector('[data-field="dsPrice"]').value;
      if(!v || Number(v) <= 0) ready = false;
    }
  }

  btn.disabled = !ready;
}

async function submitCurrentAction(){
  const a = ACTIONS[currentAction];
  const panel = document.getElementById('panel-'+currentAction);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'SAVING…';

  const params = {};
  if(a.locMode === 'warehouseOnly'){
    params.warehouse = panel.querySelector('[data-field="warehouse"]').value.trim();
  } else if(a.locMode === 'warehouseAndEvent'){
    params.warehouse = panel.querySelector('[data-field="warehouse"]').value.trim();
    params.eventId = panel.querySelector('[data-field="eventId"]').value.trim();
  } else if(a.locMode === 'twoWarehouses'){
    params.fromWarehouse = panel.querySelector('[data-field="fromWarehouse"]').value.trim();
    params.toWarehouse = panel.querySelector('[data-field="toWarehouse"]').value.trim();
  } else if(a.locMode === 'generic'){
    const loc = readGenericLocation(panel);
    params.locationType = loc.locationType;
    params.location = loc.location;
  }

  if(a.skus){
    params.lines = carts[currentAction];
  } else if(a.special === 'setQC'){
    params.setsBroken = panel.querySelector('[data-field="setsBroken"]').value;
    const counts = {};
    SCENTS.forEach(s=>{
      const acc = panel.querySelector('[data-scent="'+s+'"][data-kind="accept"]').value;
      const rej = panel.querySelector('[data-scent="'+s+'"][data-kind="reject"]').value;
      counts[s] = { accept: Number(acc)||0, reject: Number(rej)||0 };
    });
    params.scentCounts = counts;
  } else if(a.simple){
    if(a.needsScent) params.scent = panel.querySelector('[data-field="scent"] .frag-btn.sel').dataset.val;
    if(a.needsQty) params.qty = panel.querySelector('[data-field="qty"]').value;
    if(a.needsReason) params.reasonCode = panel.querySelector('[data-field="reasonCode"] .chip.sel').dataset.val;
    if(a.needsDsPrice) params.dsPrice = panel.querySelector('[data-field="dsPrice"]').value;
  }

  const payload = { action: a.apiAction, user_id: currentUser.user_id, params: params };

  try{
    await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload) });
    showSuccess(a.label.toUpperCase()+'<br>LOGGED ✓');
  }catch(e){
    queuePending(payload);
    showSuccess('SAVED<br>OFFLINE ⚠', ()=>{ document.getElementById('actionStatus').textContent='No connection — saved on this device, will sync automatically.'; document.getElementById('actionStatus').className='status-bar warn'; });
  }
  resetActionPanel(currentAction);
  btn.textContent = 'Submit';
  checkReady();
}

function resetActionPanel(key){
  const a = ACTIONS[key];
  const panel = document.getElementById('panel-'+key);
  if(a.skus){ carts[key] = []; renderCart(key); }
  if(a.special === 'setQC'){
    panel.querySelector('[data-field="setsBroken"]').value = '1';
    SCENTS.forEach(s=>{
      panel.querySelector('[data-scent="'+s+'"][data-kind="accept"]').value = '0';
      panel.querySelector('[data-scent="'+s+'"][data-kind="reject"]').value = '0';
    });
  }
  if(a.simple){
    if(a.needsScent) panel.querySelectorAll('[data-field="scent"] .frag-btn').forEach(c=>c.classList.remove('sel'));
    if(a.needsQty) panel.querySelector('[data-field="qty"]').value = '1';
    if(a.needsReason) panel.querySelectorAll('[data-field="reasonCode"] .chip').forEach(c=>c.classList.remove('sel'));
    if(a.needsDsPrice) panel.querySelector('[data-field="dsPrice"]').value = '';
  }
}

// ═══════════════════════════════════════════════════════
//  PENDING QUEUE — local backup for failed POSTs, auto-retried
// ═══════════════════════════════════════════════════════
function getPendingQueue(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ return []; } }
function setPendingQueue(q){ localStorage.setItem(PENDING_KEY, JSON.stringify(q)); updateSyncBadge(); }
function queuePending(payload){ const q=getPendingQueue(); q.push({payload:payload, queuedAt:new Date().toISOString()}); setPendingQueue(q); }
function updateSyncBadge(){
  const btn = document.getElementById('syncBtn');
  const n = getPendingQueue().length;
  if(n>0){ btn.style.display='inline-flex'; btn.textContent='🔄 Sync ('+n+')'; } else { btn.style.display='none'; }
}
async function syncPendingQueue(silent){
  const q = getPendingQueue();
  if(!q.length) return;
  const btn = document.getElementById('syncBtn');
  if(btn && !silent){ btn.disabled=true; btn.textContent='Syncing…'; }
  const stillPending = [];
  for(const item of q){
    try{ await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(item.payload)}); }
    catch(e){ stillPending.push(item); }
  }
  setPendingQueue(stillPending);
  if(btn) btn.disabled=false;
}

function showSuccess(label, afterFn){
  document.getElementById('successBig').innerHTML = label || 'SAVED ✓';
  document.getElementById('successFlash').classList.add('show');
  syncPendingQueue(true);
  setTimeout(()=>{ document.getElementById('successFlash').classList.remove('show'); if(afterFn) afterFn(); }, 1300);
}
function warmup(){ fetch(SCRIPT_URL+'?action=ping',{mode:'no-cors'}).catch(()=>{}); }

// ═══════════════════════════════════════════════════════
//  USER LOGIN — tap a name, enter PIN, verified server-side before login
// ═══════════════════════════════════════════════════════
function openUserOverlay(){ document.getElementById('userOverlay').classList.add('open'); loadUsers(); }
function closeUserOverlay(){ document.getElementById('userOverlay').classList.remove('open'); }

async function loadUsers(){
  const el = document.getElementById('userList');
  el.innerHTML = '<div class="status-bar dim">Loading…</div>';
  try{
    const res = await fetch(SCRIPT_URL+'?action=getUsers');
    const json = await res.json();
    if(!json.ok) throw new Error(json.error);
    el.innerHTML = json.data.map(u=>
      '<div class="user-row'+(currentUser && currentUser.user_id===u.user_id?' sel':'')+'" onclick=\'promptLogin('+JSON.stringify(u)+')\'>'
      + '<div><div class="user-name">'+u.name+'</div><div class="user-role">'+u.role+'</div></div>'
      + (currentUser && currentUser.user_id===u.user_id ? '<span style="color:var(--green)">✓</span>' : '')
      + '</div>'
    ).join('');
  }catch(e){
    el.innerHTML = '<div class="status-bar err">Could not load users — check the Web App URL is set. '+e.message+'</div>';
  }
}
function promptLogin(u){
  const pin = prompt('Enter PIN for ' + u.name + ':');
  if(pin === null) return;
  verifyAndLogin(u.user_id, pin);
}
async function verifyAndLogin(userId, pin){
  try{
    const res = await fetch(SCRIPT_URL+'?action=verifyLogin&user_id='+encodeURIComponent(userId)+'&pin='+encodeURIComponent(pin));
    const json = await res.json();
    if(!json.ok) throw new Error(json.error);
    selectUser(json.data);
  }catch(e){
    alert('Login failed: ' + e.message);
  }
}
function selectUser(u){
  currentUser = u;
  localStorage.setItem(USER_KEY, JSON.stringify(u));
  document.getElementById('userBtn').textContent = '👤 ' + u.name;
  closeUserOverlay();
  checkReady();
}

// ═══════════════════════════════════════════════════════
//  STOCK SUMMARY — read-only live view
// ═══════════════════════════════════════════════════════
function openStockOverlay(){ document.getElementById('stockOverlay').classList.add('open'); loadStockSummary(); }
function closeStockOverlay(){ document.getElementById('stockOverlay').classList.remove('open'); }

async function loadStockSummary(){
  const el = document.getElementById('stockTable');
  el.innerHTML = '<div class="status-bar dim">Loading…</div>';
  try{
    const res = await fetch(SCRIPT_URL+'?action=getStockSummary');
    const json = await res.json();
    if(!json.ok) throw new Error(json.error);
    if(!json.data.length){ el.innerHTML = '<div class="status-bar dim">No stock recorded yet.</div>'; return; }
    let html = '<table><tr><th>SKU</th><th>Variant</th><th>Location</th><th>Status</th><th>Qty</th></tr>';
    json.data.forEach(r=>{
      html += '<tr><td>'+r.sku+'</td><td>'+(r.variant||'-')+'</td><td>'+r.location+'</td><td>'+r.status+'</td><td>'+r.qty+'</td></tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  }catch(e){
    el.innerHTML = '<div class="status-bar err">Could not load. '+e.message+'</div>';
  }
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
buildActionTabs();
loadWarehouseSuggestions();
warmup();
updateSyncBadge();
syncPendingQueue(true);
try{
  const saved = JSON.parse(localStorage.getItem(USER_KEY)||'null');
  if(saved){ currentUser = saved; document.getElementById('userBtn').textContent = '👤 ' + saved.name; }
}catch(e){}
checkReady();
</script>
